[build]
  publish = "."

# Netlify Forms detects the static `creative-brief` form in index.html.
# Keep form detection enabled in the Netlify site settings after the first deployment.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-vj6eadeISwUZKHlEuxsFlPSQtc4F+JeoF61pKrinfXQ=' 'sha256-fO8MiW4aM/7qrK2+BGUxRlfav94KHRe33IHo4r5VsRg='; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/legal"
  to = "/mentions-legales.html"
  status = 301
  force = false

[[redirects]]
  from = "/privacy"
  to = "/confidentialite.html"
  status = 301
  force = false

[[redirects]]
  from = "/thanks"
  to = "/merci.html"
  status = 301
  force = false
